include:
  - project: cta-computing/common/aiv-toolkit
    ref: cfa3a563c868801d4fc667fe3445bbe836802b55
    file: ci-functions.yml
  - aiv-config.yml

variables:
  AIV_DEPLOY_HELM_UPGRADE_CHART_EXTRA_VALUES: " --set auth.secrets.clientId=suss-test-client
    --set auth.secrets.clientSecret=secret --set auth.secrets.sessionSecretKeyOidc=${SESSION_SECRET_KEY_OIDC}
    --set auth.secrets.refreshTokenEncryptionKey=${REFRESH_TOKEN_ENCRYPTION_KEY}"

stages:
  - prepare
  - lint
  - build
  - sign
  - tests
  - load
  - sonarqube
  - publish
  - report
  - changelog

pylint:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - pylint --fail-under 5.0 api auth_service
      --output-format=json2:pylint.json,colorized

kubeconform:
  stage: lint
  image: harbor.cta-observatory.org/proxy_cache/alpine/helm:${HELM_VERSION}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - exists:
        - $CHART_LOCATION/Chart.yaml
  before_script:
    - curl -L
      https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
      | tar xvzf -
  script:
    - helm dependencies build $CHART_LOCATION
    - helm template $CHART_LOCATION | ./kubeconform -summary -verbose -strict
      -output pretty -ignore-missing-schemas
    - helm template $CHART_LOCATION -f chart/values-aiv.yaml --set
      iam.enabled=false --set gcert-issuer.enabled=false | ./kubeconform
      -summary -verbose -strict  -output pretty -ignore-missing-schemas
pre-commit-hooks:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  before_script:
    - apt update && apt install -y --no-install-recommends git
    - python --version
    - pip install uv
    - uv sync --locked --extra all
  script:
    - uv run prek run --all-files

hadolint:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - hadolint Dockerfile.auth Dockerfile.backend Dockerfile.download
      Dockerfile.frontend

build:
  tags:
    - desy-test-cluster
  parallel:
    matrix:
      - IMAGE: ["frontend", "backend", "auth", "download"]
  before_script:
    - |
      if [ "$IMAGE" = "backend" ] || [ "$IMAGE" = "auth" ] || [ "$IMAGE" = "download" ]; then
        PRETEND_VERSION="${CI_COMMIT_TAG:-$(git describe --tags 2>/dev/null || echo '0.1.0')}"
        KANIKO_EXTRA_ARGS="${KANIKO_EXTRA_ARGS:-} --build-arg=SETUPTOOLS_SCM_PRETEND_VERSION=$PRETEND_VERSION"
        export KANIKO_EXTRA_ARGS
      fi
  variables:
    CI_HARBOR_REGISTRY_IMAGE:
      harbor.cta-observatory.org/suss/${CI_PROJECT_NAME}-${IMAGE}:${DOCKER_TAG}
    AIV_DOCKER_IMAGE_CONTEXT: $CI_PROJECT_DIR
    AIV_DOCKERFILE: Dockerfile.${IMAGE}
    DOCKER_CONFIG: /kaniko/.docker
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"

helm-lint:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - exists:
        - "$CHART_LOCATION/Chart.yaml"

kube-lint:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - exists:
        - "$CHART_LOCATION/Chart.yaml"

kube-score:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - exists:
        - "$CHART_LOCATION/Chart.yaml"

list-images:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - exists:
        - "$CHART_LOCATION/Chart.yaml"

build-docs:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

deploy_docs_env:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pages:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build-python-dist:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

publish-chart:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

sonarqube:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

build-test-report:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

check-changelog:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unit-tests-backend:
  stage: tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  image: harbor.cta-observatory.org/proxy_cache/astral/uv:0.11-python3.12-trixie
  services:
    - name: redis:7-alpine
      alias: redis
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # Test-only defaults to satisfy Settings validation during import/collection.
    # Real deployments set these via Helm/CI variables.
    POSTGRES_DB: testdb
    POSTGRES_USER: user
    POSTGRES_PASSWORD: pass
    API_DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/testdb"
    AUTH_DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/testdb"
    API_REDIS_URL: "redis://redis:6379/1"
    AUTH_REDIS_URL: "redis://redis:6379/0"
    OIDC_ISSUER: "https://example.invalid"
    OIDC_REDIRECT_URI: "http://localhost/auth/callback"
    OIDC_SERVER_METADATA_URL: "https://example.invalid/.well-known/openid-configuration"
  before_script:
    - uv sync --locked --extra test
  script:
    - uv run pytest
  artifacts:
    when: always
    paths:
      - test/coverage.xml
      - test/report.xml
    reports:
      junit: test/report.xml
      coverage_report:
        coverage_format: cobertura
        path: test/coverage.xml

unit-tests-frontend:
  stage: tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  image: harbor.cta-observatory.org/proxy_cache/node:24.2-alpine
  cache:
    key:
      files:
        - js/package-lock.json
    paths:
      - js/node_modules/
  variables:
    JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
    JEST_JUNIT_OUTPUT_DIR: coverage
    JEST_JUNIT_OUTPUT_NAME: report.xml
  before_script:
    - npm ci --prefix js
    - cat js/craco.config.js
    - cat js/package.json | grep -A2 '"test"'
  script:
    - CI=true npm test --prefix js -- --watchAll=false --coverage
      --coverageReporters=text --coverageReporters=lcov
      --coverageReporters=cobertura
  artifacts:
    when: always
    paths:
      - js/coverage/
    reports:
      junit: js/coverage/report.xml
      coverage_report:
        coverage_format: cobertura
        path: js/coverage/cobertura-coverage.xml

k8s-integration-tests:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  tags:
    - desy-testcluster-ctao-computing-aiv
  artifacts:
    when: always
    paths:
      - test-in-k8s/
      - .toolkit/stats/pull-images-statistics.json
      - .toolkit/stats/testkit-helm-upgrade-statistics.json
      - test_frontend_screenshot_1_initial.png
      - test_frontend_screenshot_2_resolve.png
      - test_frontend_screenshot_3_search.png
      - test_frontend_screenshot_4_download_before_assert.png
      - test_frontend_screenshot_5_download.png
      - login_before_submit.png
      - login_at_callback.png
      - login_after_redirect.png
      - test_login_before.png
      - test_login_after.png
      - test_logout_logged_in.png
      - test_logout_after.png
      - sky_search_timeout.png
      - test_profile.png
      - basket_add_alert.png
      - basket_after_add.png
      - test_download_alert.png
      - test_download_without_login.png
      - test_download_loading.png
      - test_download_multiple_1.png
      - test_download_multiple_2.png
      - allure-report.html
      - allure.tar.gz
    expose_as: "K8s Integration Test Results"
    reports:
      junit: test-in-k8s/report.xml

k8s-upgrade-integration-tests:
  extends: .test-in-k8s
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  tags:
    - desy-testcluster-ctao-computing-aiv
  variables:
    UPGRADE_BASE_REF: "v1.0.0-rc8"
    BASE_REF_PATCH_FILES: "pre-upgrade-patches/v1.0.0-rc8-playwright.patch"

k8s-load-smoke:
  extends: .test-in-k8s
  stage: load
  tags:
    - desy-testcluster-ctao-computing-aiv
  variables:
    AIV_DEPLOY_HELM_TEST_FILTER: name=ctao-data-explorer-k6
    AIV_DEPLOY_HELM_UPGRADE_CHART_EXTRA_VALUES: " --set auth.secrets.clientId=suss-test-client
      --set auth.secrets.clientSecret=secret
      --set auth.secrets.sessionSecretKeyOidc=${SESSION_SECRET_KEY_OIDC}
      --set auth.secrets.refreshTokenEncryptionKey=${REFRESH_TOKEN_ENCRYPTION_KEY}
      --set loadTest.enabled=true
      --set loadTest.profile=smoke
      --set mockTap.recordCount=1000"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    when: always
    paths:
      - test-in-k8s/
      - k6-summary.json
      - k6-summary.html
      - .toolkit/stats/pull-images-statistics.json
      - .toolkit/stats/testkit-helm-upgrade-statistics.json
    reports:
      junit: test-in-k8s/report.xml

k8s-load-full:
  extends: .test-in-k8s
  stage: load
  tags:
    - desy-testcluster-ctao-computing-aiv
  variables:
    HELM_TEST_TIMEOUT: 45m
    AIV_DEPLOY_HELM_TEST_FILTER: name=ctao-data-explorer-k6
    AIV_DEPLOY_HELM_UPGRADE_CHART_EXTRA_VALUES: " --set auth.secrets.clientId=suss-test-client
      --set auth.secrets.clientSecret=secret
      --set auth.secrets.sessionSecretKeyOidc=${SESSION_SECRET_KEY_OIDC}
      --set auth.secrets.refreshTokenEncryptionKey=${REFRESH_TOKEN_ENCRYPTION_KEY}
      --set loadTest.enabled=true
      --set loadTest.profile=full
      --set loadTest.activeDeadlineSeconds=2700
      --set mockTap.recordCount=50000"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  artifacts:
    when: always
    paths:
      - test-in-k8s/
      - k6-summary.json
      - k6-summary.html
      - .toolkit/stats/pull-images-statistics.json
      - .toolkit/stats/testkit-helm-upgrade-statistics.json
    reports:
      junit: test-in-k8s/report.xml


# the following two jobs can be used to test integration with external services. Currently disabled
k8s-integration-tests-with-external-iam-dcache:
  extends: k8s-integration-tests
  variables:
    AIV_DEPLOY_HELM_UPGRADE_CHART_EXTRA_VALUES: --set dev.allow_external=true
  rules:
    - when: never

k8s-upgrade-integration-tests-with-external-iam-dcache:
  extends: k8s-upgrade-integration-tests
  variables:
    AIV_DEPLOY_HELM_UPGRADE_CHART_EXTRA_VALUES: --set dev.allow_external=true
  rules:
    - when: never

collect-test-artifacts:
  stage: tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  image: $PYTHON_IMAGE
  needs:
    # can add more jobs to combine
    - job: collect-manual-tests
      artifacts: true
    - job: k8s-integration-tests
      artifacts: true
    - job: unit-tests-frontend
      artifacts: true
    - job: unit-tests-backend
      artifacts: true
  before_script:
    - !reference [.install-kit, script]
  script:
    - find . -name "report.xml" -o -name "coverage.xml" | sort
    - aiv-report -v merge-junit */report.xml js/coverage/report.xml --output
      report.xml
    - cp -fv test/coverage.xml coverage.xml
  artifacts:
    paths:
      - report.xml
      - coverage.xml
      # this is a temporary before https://gitlab.cta-observatory.org/cta-computing/common/aiv-toolkit/-/merge_requests/165
      - "*/coverage.xml"
      - js/coverage/cobertura-coverage.xml
      - js/coverage/lcov.info
      - allure.tar.gz
    reports:
      junit: report.xml

collect-manual-tests:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

pypi:
  rules:
    - when: never
