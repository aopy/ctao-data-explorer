include:
  - project: cta-computing/common/aiv-toolkit
    ref: b4d52cdb1beb0648305052f3a0e1859014ec2df7
    file: ci-functions.yml
  - aiv-config.yml

variables:
  AIV_DEPLOY_HELM_UPGRADE_CHART_EXTRA_VALUES: " --set auth.secrets.clientId=suss-test-client
    --set auth.secrets.clientSecret=secret --set auth.secrets.sessionSecretKeyOidc=${SESSION_SECRET_KEY_OIDC}
    --set auth.secrets.refreshTokenEncryptionKey=${REFRESH_TOKEN_ENCRYPTION_KEY}"

stages:
  - prepare
  - lint
  - build
  - sign
  - tests
  - sonarqube
  - publish
  - report
  - changelog

pylint:
  script:
    - pylint --fail-under 5.0 api auth_service
      --output-format=json2:pylint.json,colorized

kubeconform:
  stage: lint
  image: harbor.cta-observatory.org/proxy_cache/alpine/helm:${HELM_VERSION}
  rules:
    - exists:
        - $CHART_LOCATION/Chart.yaml
  before_script:
    - curl -L
      https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
      | tar xvzf -
  script:
    - helm dependencies build $CHART_LOCATION
    - helm template $CHART_LOCATION | ./kubeconform -summary -verbose -strict
      -output pretty -ignore-missing-schemas
    - helm template $CHART_LOCATION -f chart/values-aiv.yaml --set
      iam.enabled=false --set gcert-issuer.enabled=false | ./kubeconform
      -summary -verbose -strict  -output pretty -ignore-missing-schemas
pre-commit-hooks:
  before_script:
    - apt update && apt install -y --no-install-recommends git
    - python --version
    - pip install uv
    - uv sync --locked --extra all
  script:
    - uv run prek run --all-files

hadolint:
  script:
    - hadolint Dockerfile.auth Dockerfile.backend Dockerfile.frontend
      Dockerfile.playwright

build:
  tags:
    - desy-test-cluster
  parallel:
    matrix:
      - IMAGE: ["frontend", "backend", "auth", "playwright"]
  before_script:
    - |
      if [ "$IMAGE" = "backend" ] || [ "$IMAGE" = "auth" ]; then
        PRETEND_VERSION="${CI_COMMIT_TAG:-$(git describe --tags 2>/dev/null || echo '0.1.0')}"
        KANIKO_EXTRA_ARGS="${KANIKO_EXTRA_ARGS:-} --build-arg=SETUPTOOLS_SCM_PRETEND_VERSION=$PRETEND_VERSION"
        export KANIKO_EXTRA_ARGS
      fi
  variables:
    CI_HARBOR_REGISTRY_IMAGE:
      harbor.cta-observatory.org/suss/${CI_PROJECT_NAME}-${IMAGE}:${DOCKER_TAG}
    AIV_DOCKER_IMAGE_CONTEXT: $CI_PROJECT_DIR
    AIV_DOCKERFILE: Dockerfile.${IMAGE}
    DOCKER_CONFIG: /kaniko/.docker
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"

unit-tests-backend:
  stage: tests
  image: harbor.cta-observatory.org/proxy_cache/astral/uv:0.11-python3.12-trixie
  services:
    - name: redis:7-alpine
      alias: redis
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # Test-only defaults to satisfy Settings validation during import/collection.
    # Real deployments set these via Helm/CI variables.
    POSTGRES_DB: testdb
    POSTGRES_USER: user
    POSTGRES_PASSWORD: pass
    API_DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/testdb"
    AUTH_DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/testdb"
    API_REDIS_URL: "redis://redis:6379/1"
    AUTH_REDIS_URL: "redis://redis:6379/0"
    OIDC_ISSUER: "https://example.invalid"
    OIDC_REDIRECT_URI: "http://localhost/auth/callback"
    OIDC_SERVER_METADATA_URL: "https://example.invalid/.well-known/openid-configuration"
  before_script:
    - uv sync --locked --extra test
  script:
    - uv run pytest
  artifacts:
    when: always
    paths:
      - test/coverage.xml
      - test/report.xml
    reports:
      junit: test/report.xml
      coverage_report:
        coverage_format: cobertura
        path: test/coverage.xml

unit-tests-frontend:
  stage: tests
  image: harbor.cta-observatory.org/proxy_cache/node:24.2-alpine
  cache:
    key:
      files:
        - js/package-lock.json
    paths:
      - js/node_modules/
  variables:
    JEST_JUNIT_OUTPUT_DIR: coverage
    JEST_JUNIT_OUTPUT_NAME: report.xml
  before_script:
    - npm ci --prefix js
    - cat js/craco.config.js
    - cat js/package.json | grep -A2 '"test"'
  script:
    - CI=true npm test --prefix js -- --watchAll=false --coverage
      --coverageReporters=text --coverageReporters=lcov
      --coverageReporters=cobertura
  artifacts:
    when: always
    paths:
      - js/coverage/
    reports:
      junit: js/coverage/report.xml
      coverage_report:
        coverage_format: cobertura
        path: js/coverage/cobertura-coverage.xml

k8s-integration-tests:
  tags:
    - desy-testcluster-ctao-computing-aiv
  artifacts:
    when: always
    paths:
      - test-in-k8s/
      - .toolkit/stats/pull-images-statistics.json
      - .toolkit/stats/testkit-helm-upgrade-statistics.json
      - test_frontend_screenshot_1_before.png
      - test_frontend_screenshot_2_resolve.png
      - test_frontend_screenshot_3_search.png
      - test_frontend_screenshot_4_datalink_before_assert.png
      - test_frontend_screenshot_5_datalink.png
      - login_before_submit.png
      - login_at_callback.png
      - login_after_redirect.png
      - test_login_before.png
      - test_login_after.png
      - test_logout_logged_in.png
      - test_logout_after.png
      - basket_add_alert.png
      - basket_after_add.png
    expose_as: "K8s Integration Test Results"
    reports:
      junit: test-in-k8s/report.xml

k8s-upgrade-integration-tests:
  extends: .test-in-k8s
  tags:
    - desy-testcluster-ctao-computing-aiv
  variables:
    UPGRADE_BASE_REF: "v1.0.0-rc2"

collect-test-artifacts:
  stage: tests
  image: $PYTHON_IMAGE
  needs:
    # can add more jobs to combine
    - job: collect-manual-tests
      artifacts: true
    - job: k8s-integration-tests
      artifacts: true
    - job: unit-tests-frontend
      artifacts: true
    - job: unit-tests-backend
      artifacts: true
  before_script:
    - !reference [.install-kit, script]
  script:
    - find . -name "report.xml" -o -name "coverage.xml" | sort
    - aiv-report -v merge-junit */report.xml js/coverage/report.xml --output
      report.xml
    - cp -fv test/coverage.xml coverage.xml
  artifacts:
    paths:
      - report.xml
      - coverage.xml
      # this is a temporary before https://gitlab.cta-observatory.org/cta-computing/common/aiv-toolkit/-/merge_requests/165
      - "*/coverage.xml"
      - js/coverage/cobertura-coverage.xml
      - js/coverage/lcov.info
    reports:
      junit: report.xml

pypi:
  rules:
    - when: never

# TODO: temporary while gitlab pages are broken
build-docs:
  rules:
    - when: never

deploy-docs-env:
  rules:
    - when: never
