variables:
  # used to select UCs and Requirements from release plan
  AIV_SYSTEM: SUSS
  APPLICATION_NAME: ctao-data-explorer
  APPLICATION_AUTHOR: ctao-data-explorer Team
  APPLICATION_AUTHOR_ORGANIZATION: CTAO

  # for publishing images and charts
  HARBOR_PROJECT: suss
  HARBOR_PROJECT_ID: 10

  # Used to select Test Cases and Requirements from Jama
  JAMA_PROJECT_ID: 14  # backyard project
  APPLICATION_VERSION_FOR_VP: "1.0.0"
  JAMA_RELEASE_TAG: "SDC Portal 1.0.0"
  DISABLE_JUNIT_TEST_PARSING: true
  RELEASE_PLAN_FROM_JAMA: true

  AIV_DEPLOY_HELM_TEST_FILTER: name=ctao-data-explorer-pytest

  AIV_DOCKER_IMAGE_CONTEXT: .

  CHART_NAME: ctao-data-explorer
  CHART_LOCATION: chart
  # CI/test overrides — IAM, gcert-issuer, test credentials
  CHART_VALUES: chart/values-aiv.yaml

  ENABLE_INGRESS: true

  ALLOWED_IMAGE_PREFIXES: docker,postgres,redis,registry.k8s.io,grafana

  APPLY_PRE_UPGRADE_URL: https://gitlab.cta-observatory.org/cta-computing/common/gcert-issuer/-/raw/main/chart/crds/gcert-request.yaml
