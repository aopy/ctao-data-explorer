<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2328" viewBox="0 0 1800 2328"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#244d68"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#763aba"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#657489"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b620c"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="55" y="62" font-family="Arial, sans-serif" font-size="38" fill="#172d40" font-weight="700" text-anchor="start">Single-file browser download</text><text x="55" y="104" font-family="Arial, sans-serif" font-size="22" fill="#657489" font-weight="400" text-anchor="start">Login → public search → token exchange → direct storage download</text><rect x="35" y="145" width="1730" height="863" rx="14" fill="#ffffff" stroke="#d4dfe8"/><text x="60" y="183" font-family="Arial, sans-serif" font-size="26" fill="#244d68" font-weight="700" text-anchor="start">1  Sign in · OpenID Connect authorization-code flow</text><rect x="54.0" y="198" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="170.0" y="219" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">User device</text><rect x="540.6666666666667" y="198" width="718.6666666666667" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="900.0000000000001" y="219" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">Portal backend</text><rect x="1514.0" y="198" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="1630.0" y="219" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">Identity provider</text><rect x="54.0" y="237" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="170.0" y="265" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Browser</text><path d="M170.0,282 L170.0,908" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="540.6666666666667" y="237" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="656.6666666666667" y="265" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Auth Service</text><path d="M656.6666666666667,282 L656.6666666666667,908" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="1027.3333333333335" y="237" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="1143.3333333333335" y="265" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Redis (sessions)</text><path d="M1143.3333333333335,282 L1143.3333333333335,908" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="1514.0" y="237" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="1630.0" y="265" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">CTAO IAM</text><path d="M1630.0,282 L1630.0,908" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="340.73333333333335" y="298" width="145.2" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="413.33333333333337" y="320" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="400" text-anchor="middle">Start login</text><path d="M170.0,329 L656.6666666666667,329" fill="none" stroke="#244d68" stroke-width="2.5" marker-end="url(#blue)"/><rect x="133.53333333333342" y="366" width="559.5999999999999" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="413.33333333333337" y="388" font-family="Arial, sans-serif" font-size="21" fill="#9b620c" font-weight="400" text-anchor="middle">Set temporary OIDC state cookie; redirect to IAM</text><path d="M656.6666666666667,397 L170.0,397" fill="none" stroke="#9b620c" stroke-width="2.5" marker-end="url(#amber)"/><rect x="782.6" y="434" width="234.79999999999998" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="900.0" y="456" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="400" text-anchor="middle">Authenticate at IAM</text><path d="M170.0,465 L1630.0,465" fill="none" stroke="#244d68" stroke-width="2.5" marker-end="url(#blue)"/><rect x="676.2" y="502" width="447.59999999999997" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="900.0" y="524" font-family="Arial, sans-serif" font-size="21" fill="#657489" font-weight="400" text-anchor="middle">Redirect to callback with code + state</text><path d="M1630.0,533 L170.0,533" fill="none" stroke="#657489" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray)"/><rect x="111.13333333333338" y="570" width="604.4" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="413.33333333333337" y="592" font-family="Arial, sans-serif" font-size="21" fill="#9b620c" font-weight="400" text-anchor="middle">Callback: code + state + temporary OIDC state cookie</text><path d="M170.0,601 L656.6666666666667,601" fill="none" stroke="#9b620c" stroke-width="2.5" marker-end="url(#amber)"/><rect x="913.9333333333335" y="638" width="458.79999999999995" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="1143.3333333333335" y="660" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">Exchange code + auth-client credentials</text><path d="M656.6666666666667,669 L1630.0,669" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="975.5333333333335" y="706" width="335.59999999999997" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="1143.3333333333335" y="728" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">UAT + ID token + optional RT</text><path d="M1630.0,737 L656.6666666666667,737" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="581.0000000000001" y="774" width="638.0" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="900.0000000000001" y="796" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">Validate state / ID token; store session (RT encrypted)</text><path d="M656.6666666666667,805 L1143.3333333333335,805" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="60.0" y="842" width="727.5999999999999" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="423.79999999999995" y="864" font-family="Arial, sans-serif" font-size="21" fill="#9b620c" font-weight="400" text-anchor="middle">Set HttpOnly SID cookie; /auth/me returns profile + XSRF cookie</text><path d="M656.6666666666667,873 L170.0,873" fill="none" stroke="#9b620c" stroke-width="2.5" marker-end="url(#amber)"/><text x="62" y="931" font-family="Arial, sans-serif" font-size="20" fill="#657489" font-weight="400" text-anchor="start">Browser holds SID, not UAT. Auth resolves SID in Redis; a still-valid UAT near expiry may be refreshed using RT.</text><text x="62" y="963" font-family="Arial, sans-serif" font-size="20" fill="#657489" font-weight="400" text-anchor="start">Expired UAT requires login again. Client secrets stay on the server.</text><rect x="35" y="1030" width="1730" height="459" rx="14" fill="#ffffff" stroke="#d4dfe8"/><text x="60" y="1068" font-family="Arial, sans-serif" font-size="26" fill="#244d68" font-weight="700" text-anchor="start">2  Search and choose an observation</text><rect x="54.0" y="1083" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="170.0" y="1104" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">User device</text><rect x="784.0" y="1083" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="900.0" y="1104" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">Portal backend</text><rect x="1514.0" y="1083" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="1630.0" y="1104" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">Metadata services</text><rect x="54.0" y="1122" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="170.0" y="1150" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Browser</text><path d="M170.0,1167 L170.0,1453" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="784.0" y="1122" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="900.0" y="1150" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">FastAPI backend</text><path d="M900.0,1167 L900.0,1453" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="1514.0" y="1122" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="1630.0" y="1150" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">TAP Server</text><path d="M1630.0,1167 L1630.0,1453" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="255.20000000000005" y="1183" width="559.5999999999999" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="535.0" y="1205" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="400" text-anchor="middle">GET /api/search_coords · no user bearer attached</text><path d="M170.0,1214 L900.0,1214" fill="none" stroke="#244d68" stroke-width="2.5" marker-end="url(#blue)"/><rect x="918.0" y="1251" width="694.0" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="1265.0" y="1273" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="400" text-anchor="middle">ADQL query on ObsCore table (results may be cached in Redis)</text><path d="M900.0,1282 L1630.0,1282" fill="none" stroke="#244d68" stroke-width="2.5" marker-end="url(#blue)"/><rect x="1142.0" y="1319" width="246.0" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="1265.0" y="1341" font-family="Arial, sans-serif" font-size="21" fill="#657489" font-weight="400" text-anchor="middle">Observation metadata</text><path d="M1630.0,1350 L900.0,1350" fill="none" stroke="#657489" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray)"/><rect x="238.40000000000003" y="1387" width="593.1999999999999" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="535.0" y="1409" font-family="Arial, sans-serif" font-size="21" fill="#657489" font-weight="400" text-anchor="middle">Results → select primary file reference (LFN / URL)</text><path d="M900.0,1418 L170.0,1418" fill="none" stroke="#657489" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray)"/><rect x="35" y="1511" width="1730" height="759" rx="14" fill="#ffffff" stroke="#d4dfe8"/><text x="60" y="1549" font-family="Arial, sans-serif" font-size="26" fill="#244d68" font-weight="700" text-anchor="start">3  Prepare and download the file</text><rect x="54.0" y="1564" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="170.0" y="1585" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">User device</text><rect x="419.0" y="1564" width="597.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="717.5" y="1585" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">Portal backend</text><rect x="1149.0" y="1564" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="1265.0" y="1585" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">Identity provider</text><rect x="1514.0" y="1564" width="232.0" height="29" rx="5" fill="#e5edf4" stroke="#d4dfe8"/><text x="1630.0" y="1585" font-family="Arial, sans-serif" font-size="16" fill="#657489" font-weight="700" text-anchor="middle">dCache · intermediate DL3</text><rect x="54.0" y="1603" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="170.0" y="1631" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Browser</text><path d="M170.0,1648 L170.0,2138" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="419.0" y="1603" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="535.0" y="1631" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Auth Service</text><path d="M535.0,1648 L535.0,2138" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="784.0" y="1603" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="900.0" y="1631" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">Download Service</text><path d="M900.0,1648 L900.0,2138" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="1149.0" y="1603" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="1265.0" y="1631" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">CTAO IAM</text><path d="M1265.0,1648 L1265.0,2138" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="1514.0" y="1603" width="232" height="42" rx="8" fill="#edf3f8" stroke="#d4dfe8"/><text x="1630.0" y="1631" font-family="Arial, sans-serif" font-size="21" fill="#244d68" font-weight="700" text-anchor="middle">dCache storage</text><path d="M1630.0,1648 L1630.0,2138" fill="none" stroke="#d4dfe8" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="134.3" y="1664" width="436.4" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="352.5" y="1686" font-family="Arial, sans-serif" font-size="21" fill="#9b620c" font-weight="400" text-anchor="middle">POST /auth/download/signed-urls + SID</text><path d="M170.0,1695 L535.0,1695" fill="none" stroke="#9b620c" stroke-width="2.5" marker-end="url(#amber)"/><rect x="415.3" y="1732" width="604.4" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="717.5" y="1754" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">Session lookup → forward file reference + Bearer UAT</text><path d="M535.0,1763 L900.0,1763" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="780.3" y="1800" width="604.4" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="1082.5" y="1822" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">RFC 8693 exchange: UAT + download-client credentials</text><path d="M900.0,1831 L1265.0,1831" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="1004.3" y="1868" width="156.39999999999998" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="1082.5" y="1890" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">SAT + expiry</text><path d="M1265.0,1899 L900.0,1899" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="272.0" y="1936" width="526.0" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="535.0" y="1958" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">Via Auth: storage URL + separate SAT + expiry</text><path d="M900.0,1967 L170.0,1967" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="676.2" y="2004" width="447.59999999999997" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="900.0" y="2026" font-family="Arial, sans-serif" font-size="21" fill="#763aba" font-weight="400" text-anchor="middle">CORS preflight; HTTPS GET + Bearer SAT</text><path d="M170.0,2035 L1630.0,2035" fill="none" stroke="#763aba" stroke-width="2.5" marker-end="url(#purple)"/><rect x="681.8" y="2072" width="436.4" height="29" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="900.0" y="2094" font-family="Arial, sans-serif" font-size="21" fill="#657489" font-weight="400" text-anchor="middle">File bytes → browser Blob → save file</text><path d="M1630.0,2103 L170.0,2103" fill="none" stroke="#657489" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray)"/><text x="62" y="2161" font-family="Arial, sans-serif" font-size="20" fill="#657489" font-weight="400" text-anchor="start">Download Service maps LFN prefixes and checks allowed HTTPS hosts. The URL itself is not a signed URL.</text><text x="62" y="2193" font-family="Arial, sans-serif" font-size="20" fill="#657489" font-weight="400" text-anchor="start">dCache may redirect from door to pool; browser redirect / CORS rules apply (cross-origin Authorization is stripped).</text><text x="62" y="2225" font-family="Arial, sans-serif" font-size="20" fill="#657489" font-weight="400" text-anchor="start">Download routes have no explicit CSRF validation. SID and UAT are not sent to storage.</text><text x="55" y="2304" font-family="Arial, sans-serif" font-size="20" fill="#657489" font-weight="400" text-anchor="start">SID = session cookie ID   •   UAT = user access token   •   SAT = storage access token   •   RT = refresh token</text></svg>
