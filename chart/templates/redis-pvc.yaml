{{- if and .Values.redis.enabled .Values.redis.master.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ctao-data-explorer.fullname" . }}-redis-data
spec:
  storageClassName: {{ .Values.redis.master.persistence.storageClass | quote }}
  accessModes: {{- range .Values.redis.master.persistence.accessModes }}
    - {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.master.persistence.size | quote }}
{{- end }}
