---
apiVersion: v1
kind: Pod
metadata:
  name: "ctao-data-explorer-pytest"
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
  - name: repo
    hostPath:
      path: /repo
  automountServiceAccountToken: false
  containers:
    - name: pytest
      # playwright requires ubuntu to run browser tests
      image: "{{ .Values.global.imageRegistry }}/{{ .Values.dev.test_pod.image.repository }}:{{ .Values.dev.test_pod.image.tag | default .Chart.AppVersion }}"
      securityContext:
        allowPrivilegeEscalation: false
      imagePullPolicy: IfNotPresent
      env:
        - name: PLAYWRIGHT_BROWSERS_PATH
          value: /opt/ms-playwright
        # This will be required for tests that need to authenticate in IAM test instance.
        - name: TEST_USER
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-secrets"
              key: testUser
              optional: true
        - name: TEST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-secrets"
              key: testPassword
              optional: true
        - name: FRONTEND_URL
          value: "https://{{ (index .Values.ingress.hosts 0).host }}"
      workingDir: /tmp
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          . /opt/venv/bin/activate

          {{ if .Values.dev.run_tests }}

          {{ if .Values.dev.allow_external }}
          export TEST_ALLOW_EXTERNAL_COMMUNICATION=true
          {{ end }}


          git config --global --add safe.directory /repo
          pip install -e /repo/[test]
          cp -r /repo/tests /tmp/tests
          pytest /tmp/tests/test_playwright.py \
            -v --maxfail=1 --disable-warnings -o log-cli=true --log-cli-level=INFO \
            --cov \
            --cov-report=xml:/tmp/coverage.xml \
            --junitxml=/tmp/report.xml \
            --color=yes \
            --browser=firefox --base-url=$FRONTEND_URL \
            --alluredir allure-results

          allure awesome --single-file allure-results/ -o allure-report

          tar -czf allure.tar.gz allure-report allure-results
          curl -T allure-report/index.html http://testkit:8000/allure-report.html
          cp -fv allure-report/index.html /repo/allure-report.html
          cp -fv allure.tar.gz /repo/allure.tar.gz


          cp /tmp/screenshots/*.png /repo/ || true
          curl -T /tmp/coverage.xml http://testkit:8000/coverage.xml
          curl -T /tmp/report.xml http://testkit:8000/report.xml
          {{ end }}

          {{ if .Values.dev.sleep }}
          sleep infinity
          {{ end }}


      volumeMounts:
        - name: repo
          mountPath: /repo
          readOnly: false

      resources:
      {{- toYaml .Values.dev.test_pod.resources | nindent 8 }}


  restartPolicy: Never
