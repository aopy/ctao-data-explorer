{{- if .Values.download.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ctao-data-explorer.fullname" . }}-download
  labels:
    {{- include "ctao-data-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: download
spec:
  type: {{ .Values.download.service.type }}
  ports:
    - port: {{ .Values.download.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ctao-data-explorer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: download
{{- end }}
