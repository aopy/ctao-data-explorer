{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ctao-data-explorer.fullname" . }}-auth
  labels:
    {{- include "ctao-data-explorer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.auth.service.type }}
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: {{ .Values.auth.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "ctao-data-explorer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
{{- end }}
