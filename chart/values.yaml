# Default values for ctao-data-explorer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imagePullSecrets: []
  imageRegistry: harbor.cta-observatory.org
  dockerProxy: harbor.cta-observatory.org/proxy_cache

dev:
  run_tests: true
  sleep: false
  mount_repo: true

  frontend:
    dangerouslyDisableHostCheck: true

  test_pod:
    image:
      repository: suss/ctao-data-explorer-playwright      
      tag: 
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
        ephemeral-storage: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 1Gi

# Test credentials (used when iam.enabled=true provides local IAM users)
tests:
  testUser: sdc-user
  testPassword: test-password
  # Set to a pre-created secret name to skip auto-generation
  existingSecret: ""

# Backend (FastAPI) configuration
backend:
  enabled: true
  replicaCount: 1

  databaseUrlSecret:
    name: ""
    key: "url"
  
  image:
    repository: suss/ctao-data-explorer-backend
    pullPolicy: IfNotPresent
    tag: 
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  env:
    # These will be constructed from postgres service
    # DATABASE_URL: constructed in template
    # REDIS_URL: constructed in template

    # Back-end base URL (app URL)
    BASE_URL: "https://ctao-data-explorer.test.example"

    # Database & Redis
    # REDIS_URL: redis://redis:6379/0

    # # OPUS
    OPUS_ROOT: "https://voparis-uws-test.obspm.fr"
    OPUS_SERVICE: "gammapy_source_analysis"

    # # Cookies
    # COOKIE_SAMESITE: None
    # COOKIE_SECURE: false
    # COOKIE_DOMAIN:

    # # Metrics
    # METRICS_ENABLED: true
    # METRICS_ROUTE: /metrics
    # METRICS_PROTECT_WITH_BASIC_AUTH: false

    # # Dev toggles
    # PRODUCTION: false    
  
  envFrom: []
  # - secretRef:
  #     name: backend-secrets
  # - configMapRef:
  #     name: backend-config

auth:
  enabled: true
  replicaCount: 1
  
  image:
    repository: suss/ctao-data-explorer-auth
    pullPolicy: IfNotPresent
    tag: 

  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 512Mi

  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  secrets:
    existingSecret: ""
    clientId: suss-test-client  # Required; matches IAM bootstrap config
    clientSecret: secret  # Required; matches IAM bootstrap config
    # refreshTokenEncryptionKey: not set, auto-generated by template
    # sessionSecretKeyOidc: not set, auto-generated by template

  env:
    BASE_URL: "https://ctao-data-explorer.test.example"
    FRONTEND_BASE_URL: "https://ctao-data-explorer.test.example/"
    OIDC_REDIRECT_URI: "https://ctao-data-explorer.test.example/auth/oidc/callback"
    COOKIE_DOMAIN: "ctao-data-explorer.test.example"
    COOKIE_SECURE: false
    COOKIE_SAMESITE: "Lax"

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: suss/ctao-data-explorer-frontend
    pullPolicy: IfNotPresent
    tag: 
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources:
    limits:
      cpu: 2000m
      memory: 4096Mi
      ephemeral-storage: 2Gi
    requests:
      cpu: 250m
      memory: 1024Mi
      ephemeral-storage: 1Gi
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false

  extraVolumes:
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}

  extraVolumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: ao
    password: password
    database: fastapi_db
  
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 2Gi
      requests:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 1Gi
  
  service:
    type: ClusterIP
    port: 5432

# Redis configuration
redis:
  enabled: true
  
  master:
    persistence:
      enabled: false
    
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  
  service:
    type: ClusterIP
    port: 6379

# gcert-issuer: handles CA and TLS cert generation for in-cluster services
# Follows DPPS pattern: top-level gcert-issuer, disabled in IAM sub-chart
gcert-issuer:
  enabled: true
  server_names: []
  users: []
  bootstrap_job:
    enabled: true
  dev:
    mount_repo: false
    run_tests: false
    default_gcrqs_enabled: false

# IAM (INDIGO IAM) for local authentication testing
# See also: Chart.yaml dependency with alias: iam
iam:
  enabled: true

  # Disable IAM's built-in gcert-issuer sub-chart; top-level gcert-issuer handles this
  gcert-issuer:
    enabled: false

  global:
    fqdn: iam-ctao-data-explorer.test.example

  ingress:
    enabled: true
    annotations:
      haproxy.org/ssl-redirect: "true"
      haproxy.org/ssl-redirect-port: "443"
    className: haproxy
    tls:
      enabled: true
      secretName: iam-tls

  # Database config: host must match MariaDB subchart service name ({release}-mariadb)
  database:
    host: '{{ .Release.Name }}-mariadb'

  # Use IAM's built-in MariaDB (with emptyDir for testing, no PVC needed)
  mariadb:
    enabled: true
    auth:
      password: test-password
    image:
      repository: proxy_cache/bitnamilegacy/mariadb
      tag: 12.0.2-debian-12-r0
    primary:
      persistence:
        enabled: false

  # VOMS AA: not needed for OIDC auth testing
  vomsAA:
    enabled: false

  # Cert requester: not needed (TLS cert generated by gcert-issuer's request-iam-server GCRQ)
  certRequester:
    enabled: false

  # Test client: must provide ID/secret (template is unconditional)
  testClient:
    enabled: true
    config:
      client:
        id: test-client
        secret: secret

  # Reduced resource requests for local/CI testing
  loginService:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi

  bootstrap:
    enabled: true
    config:
      clients:
        - client_id: suss-test-client
          client_name: Test Client
          client_secret: secret
          grant_types:
            - authorization_code
            - password
            - client_credentials
            - urn:ietf:params:oauth:grant_type:redelegate
            - refresh_token
          redirect_uris:
            - "https://ctao-data-explorer.test.example/auth/oidc/callback"
          scopes:
            - scim:write
            - scim:read
            - offline_access
            - openid
            - profile
            - email
            - iam:admin.write
            - iam:admin.read
      groups:
        - name: ctao.suss.test
        - name: ctao.suss.test/sdc
        - name: ctao.suss.test/sdc/user
      users:
        - username: sdc-user
          password: test-password
          email: sdc@test.example
          given_name: SDC
          family_name: User
          groups:
            - ctao.suss.test
            - ctao.suss.test/sdc/user
          role: ROLE_USER

  trustStore:
    addAIVCA: true
    testCASecretName: '{{ .Release.Name }}-test-ca'

ingress:
  enabled: true
  className: "haproxy"

  # Annotations to add to the ingress resource
  # Example: cert-manager annotations for automatic TLS certificates
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/ingress.class: haproxy
    # kubernetes.io/tls-acme: "true"
  
  # Hostname for accessing the application
  # You may need to add this to /etc/hosts for local development
  # Example: 127.0.0.1 ctao-data-explorer.test.example
  hosts:
    - host: ctao-data-explorer.test.example
      paths:
        - path: /api
          pathType: Prefix
          backend: backend

        - path: /auth
          pathType: Prefix
          backend: auth

        - path: /
          pathType: Prefix
          backend: frontend      

  
  # tls:
  #   - secretName: data-explorer-tls
  #     hosts:
  #       - ctao-data-explorer.test.example

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Service ports for ingress
servicePorts:
  backend: 8000
  frontend: 80
  auth: 8001
  iam: 8080

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
