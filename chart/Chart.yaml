apiVersion: v2
name: ctao-data-explorer
description: A Helm chart for CTAO Data Explorer application
type: application
version: 0.1.0
appVersion: "dev"
keywords:
  - ctao
  - data-explorer
  - fastapi
  - react
maintainers:
  - name: CTAO Team
home: https://gitlab.cta-observatory.org/cta-computing/suss/scienceportal/prototypes/ctao-data-explorer
sources:
  - https://gitlab.cta-observatory.org/cta-computing/suss/scienceportal/prototypes/ctao-data-explorer

dependencies:
  - name: indigo-iam
    condition: iam.enabled
    alias: iam
    version: v0.1.0-rc2
    repository: oci://harbor.cta-observatory.org/aai

  - name: gcert-issuer
    condition: gcert-issuer.enabled
    version: v0.2.0
    repository: oci://harbor.cta-observatory.org/common 
