[workspace]
name = "ctao-data-explorer-backend"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
fastapi = "0.136.*"
fastapi-users = "15.0.*"
fastapi-users-db-sqlalchemy = "*"
uvicorn = "0.32.*"
starlette = "1.0.*"
aiofiles = "22.1.*"
pyvo = "1.*"
numpy = "2.1.*"
requests = "2.33.*"
cryptography = ">=46.0.5,<47"
hiredis = "3.2.*"
authlib = "1.6.*"
itsdangerous = "*"
asyncpg = "*"
httpx = "0.28.*"
xmltodict = "1.0.*"
alembic = "1.14.*"
psycopg2 = "*"
libpq = "*"
mako = "1.3.*"
python-multipart = "0.0.*"
astropy = "6.1.*"
pydantic = "2.9.*"
anyio = "4.4.*"
python-dotenv = "*"
redis-py = "*"
pydantic-settings = "*"
prometheus-fastapi-instrumentator = "*"
asgi-lifespan = ">=2.1.0,<3"
aiosqlite = ">=0.22.1,<0.23"


[tasks]
migrate = "alembic upgrade head"
serve = "uvicorn api.main:app --host 0.0.0.0 --port 8000"
auth-serve = "uvicorn auth_service.main:app --host 0.0.0.0 --port 8001"
serve-reload = "uvicorn api.main:app --reload --host 0.0.0.0 --port 8000"
build-frontend = "bash -lc 'cd js && npm ci && npm run build'"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"

[feature.test.tasks]
test = "pytest"

[feature.docs.dependencies]
sphinx = ">=8.1,<9"
sphinx-autodoc-typehints = "*"
sphinx-design = "*"
towncrier = "==24.8.0"
setuptools-scm = "*"

[feature.docs.pypi-dependencies]
sphinx-changelog = ">=1.6.0"
ctao-sphinx-theme = ">=0.1.2,<0.2"

[feature.docs.tasks]
clean-docs = "rm -rf docs/build"
doc = "sphinx-build -W -b html docs docs/build/html"
build-changelog = "towncrier build --yes --version $(python -m setuptools_scm)"

[environments]
test = ["test"]
doc = ["docs"]
