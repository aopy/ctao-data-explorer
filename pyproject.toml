[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ctao-data-explorer"
description = "CTAO Data Explorer"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Onur Ates", email = "onur.ates@cta-consortium.org"},
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<0.137",
    "fastapi-users>=15.0,<16",
    "fastapi-users-db-sqlalchemy",
    "uvicorn>=0.32,<0.33",
    "aiofiles>=22.1",
    "pyvo>=1,<2",
    "numpy>=2.1,<2.2",
    "requests>=2.33,<2.34",
    "cryptography>=46.0.5,<47",
    "hiredis>=3.2,<3.3",
    "authlib>=1.6,<1.8",
    "itsdangerous",
    "asyncpg",
    "httpx>=0.28,<0.29",
    "xmltodict>=1.0,<1.1",
    "alembic>=1.14,<1.15",
    "psycopg2-binary",
    "astropy>=6.1,<6.2",
    "pydantic>=2.9,<2.10",
    "anyio>=4.4,<4.5",
    "python-dotenv",
    "redis",
    "pydantic-settings",
    "prometheus-fastapi-instrumentator",
    "starlette>=1.0.0,<1.1",
    "mako>=1.3.11,<1.4",
    "python-multipart>=0.0.26,<0.1",
    "asgi-lifespan>=2.1.0,<3",
    "aiosqlite>=0.22.1,<0.23",
]

# needed for setuptools_scm to find the version from git tags
dynamic = ["version"]

[project.optional-dependencies]
doc = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-changelog",
    "sphinx-design",
    "numpydoc",
    "ctao-sphinx-theme~=0.1.2",
    "towncrier",
]
dev = [
  "setuptools_scm",
  "towncrier",
]

all = ["ctao-data-explorer[test,doc,dev]"]

[project.urls]
repository = "https://gitlab.cta-observatory.org/cta-computing/suss/scienceportal/prototypes/ctao-data-explorer"
documentation = "http://cta-computing.gitlab-pages.cta-observatory.org/suss/scienceportal/prototypes/ctao-data-explorer"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "auth_service*"]

# For coverage.py to find the source files when running from the project root
# and better management therefore in SonarQube
[tool.coverage.run]
relative_files = true
source = ["."]
include = [
    "api/**",
    "auth_service/**",
]

[tool.coverage.report]
include = [
    "api/**",
    "auth_service/**",
]

[tool.towncrier]
package = "ctao-data-explorer"
package_dir = "api"
# directory for fragments
directory = "docs/changes"
filename = "CHANGES.rst"
template = "docs/changes/template.rst"
underlines = ["-", "~", "^"]
# Let towncrier create proper links to the merged MR.
# By default, towncrier connects everything to issues.
# We rather want to connect it to merge request
issue_format = "`!{issue} <https://gitlab.cta-observatory.org/cta-computing/suss/scienceportal/prototypes/ctao-data-explorer/-/merge_requests/{issue}>`__"

[tool.towncrier.fragment.feature]
    name = "New Features"
    showcontent = true

[tool.towncrier.fragment.bugfix]
    name = "Bug Fixes"
    showcontent = true

[tool.towncrier.fragment.api]
    name = "API Changes"
    showcontent = true

[tool.towncrier.fragment.optimization]
    name = "Refactoring and Optimization"
    showcontent = true

[tool.towncrier.fragment.maintenance]
    name = "Maintenance"
    showcontent = true


[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = """
(
  ^alembic/|
  ^js/|
  ^node_modules/|
  ^dist/|
  ^build/|
  ^docs/_build/
)
"""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "tests"]
respect-gitignore = true
extend-exclude = [
  "alembic",
  "js",
  "node_modules",
  "dist",
  "build",
  "docs/_build",
]

[tool.ruff.lint]
# Pyflakes/pycodestyle/isort/pyupgrade/bugbear/comprehensions/unused-args family
select = ["F", "E", "W", "I", "UP", "B", "C4", "ARG", "RUF"]
# let Black own line length
extend-ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

# isort tuning (Ruff implements isort)
[tool.ruff.lint.isort]
known-first-party = ["api"]
combine-as-imports = true

# targeted ignores
[tool.ruff.lint.per-file-ignores]
# FastAPI endpoints: allow Depends/Query/Body in defaults
"api/**/*.py" = ["B008"]
"auth_service/**/*.py" = ["B008"]

"tests/**" = ["ARG", "S101", "ARG001", "ARG002"]
"api/tests/**" = ["ARG", "S101", "ARG001", "ARG002"]

# Allow re-exports in package init files
"api/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["api"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Reporting / strictness
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 3rd-party libs without stubs
ignore_missing_imports = true

# Skip non-Python areas & tests (you can remove the tests bit later if you want to type-check them)
exclude = "(^alembic/|^js/|^node_modules/|^dist/|^build/|^docs/_build/|^api/tests/)"

# If we prefer to keep tests included but silence them, use this override
# and remove "^api/tests/" from exclude above.
[[tool.mypy.overrides]]
module = ["api.tests.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_untyped_fields = true