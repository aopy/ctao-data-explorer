[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ctao-data-explorer"
description = "CTAO Data Explorer"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Onur Ates", email = "onur.ates@cta-consortium.org"},
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "fastapi-users>=15.0,<16",
    "fastapi-users-db-sqlalchemy",
    "uvicorn>=0.32,<0.33",
    "aiofiles>=22.1",
    "pyvo>=1,<2",
    "numpy>=2.1,<2.2",
    "requests>=2.32,<2.33",
    "cryptography>=46.0.5,<47",
    "hiredis>=3.2,<3.3",
    "authlib>=1.4,<1.5",
    "itsdangerous",
    "asyncpg",
    "httpx>=0.28,<0.29",
    "xmltodict>=1.0,<1.1",
    "alembic>=1.14,<1.15",
    "psycopg2-binary",
    "astropy>=6.1,<6.2",
    "pydantic>=2.9,<2.10",
    "anyio>=4.4,<4.5",
    "python-dotenv",
    "redis",
    "pydantic-settings",
    "prometheus-fastapi-instrumentator",
    "asgi-lifespan>=2.1.0,<3",
    "aiosqlite>=0.22.1,<0.23",
]

# needed for setuptools_scm to find the version from git tags
dynamic = ["version"]

[project.urls]
repository = "https://gitlab.cta-observatory.org/cta-computing/suss/scienceportal/prototypes/ctao-data-explorer"
documentation = "http://cta-computing.gitlab-pages.cta-observatory.org/suss/scienceportal/prototypes/ctao-data-explorer"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "auth_service*", "ctao_shared*"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = """
(
  ^alembic/|
  ^js/|
  ^node_modules/|
  ^dist/|
  ^build/|
  ^docs/_build/
)
"""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "tests"]
respect-gitignore = true
extend-exclude = [
  "alembic",
  "js",
  "node_modules",
  "dist",
  "build",
  "docs/_build",
]

[tool.ruff.lint]
# Pyflakes/pycodestyle/isort/pyupgrade/bugbear/comprehensions/unused-args family
select = ["F", "E", "W", "I", "UP", "B", "C4", "ARG", "RUF"]
# let Black own line length
extend-ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

# isort tuning (Ruff implements isort)
[tool.ruff.lint.isort]
known-first-party = ["api"]
combine-as-imports = true

# targeted ignores
[tool.ruff.lint.per-file-ignores]
# FastAPI endpoints: allow Depends/Query/Body in defaults
"api/**/*.py" = ["B008"]
"auth_service/**/*.py" = ["B008"]

"tests/**" = ["ARG", "S101", "ARG001", "ARG002"]
"api/tests/**" = ["ARG", "S101", "ARG001", "ARG002"]

# Allow re-exports in package init files
"api/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["api"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Reporting / strictness
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 3rd-party libs without stubs
ignore_missing_imports = true

# Skip non-Python areas & tests (you can remove the tests bit later if you want to type-check them)
exclude = "(^alembic/|^js/|^node_modules/|^dist/|^build/|^docs/_build/|^api/tests/)"

# If we prefer to keep tests included but silence them, use this override
# and remove "^api/tests/" from exclude above.
[[tool.mypy.overrides]]
module = ["api.tests.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_untyped_fields = true